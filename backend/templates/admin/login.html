{% extends "admin/base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<h1>Entrar no painel</h1>
{% if erro %}<p class="aviso erro" role="alert">{{ erro }}</p>{% endif %}
<form method="post" class="formulario" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required autocomplete="username" maxlength="150" value="{{ email }}">
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" required autocomplete="current-password" maxlength="200">
  <button class="botao grande" type="submit">Entrar</button>
</form>
{% endblock %}
