{% extends "admin/base.html" if painel and session.get('admin_id') else "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="aviso erro" role="alert">
  <h1>{{ titulo }}</h1>
  <p>{{ mensagem }}</p>
</div>
{% if painel and session.get('admin_id') %}
<a class="botao" href="{{ url_for('admin.eventos') }}">Voltar ao painel</a>
{% else %}
<a class="botao" href="{{ url_for('listar') }}">Ver eventos</a>
{% endif %}
{% endblock %}
