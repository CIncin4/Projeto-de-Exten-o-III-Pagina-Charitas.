<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Eventos{% endblock %} · Charitas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topo">
    <a class="marca" href="{{ url_for('listar') }}">
      <span class="marca-nome">Charitas</span>
      <span class="marca-sub">Casa de Cultura José de Dome · Cabo Frio</span>
    </a>
  </header>
  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>
  <footer class="rodape">Seus dados são usados apenas para organizar o evento.</footer>
</body>
</html>
